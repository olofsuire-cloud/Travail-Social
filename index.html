<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Académique - Travail Social</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">
    <header class="bg-indigo-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">Portail Académique | Travail Social</h1>
            <div id="user-status" class="text-sm bg-indigo-800 px-3 py-1.5 rounded-lg">Chargement...</div>
        </div>
    </header>
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-semibold mb-4 text-indigo-900">Accès Utilisateur</h2>
                <div id="auth-container" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Courriel</label>
                        <input type="email" id="email" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="votre.courriel@uqat.ca">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Mot de passe</label>
                        <input type="password" id="password" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="••••••••">
                    </div>
                    <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition font-medium">Se connecter</button>
                    <button onclick="handleSignup()" class="w-full bg-slate-100 text-slate-700 py-2 rounded-lg hover:bg-slate-200 transition font-medium text-sm">Créer un compte</button>
                </div>
                <div id="logout-container" class="hidden">
                    <p id="user-email-display" class="text-sm mb-4 text-slate-600"></p>
                    <button onclick="handleLogout()" class="w-full bg-red-50 text-red-600 py-2 rounded-lg hover:bg-red-100 transition font-medium">Se déconnecter</button>
                </div>
            </div>
            <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-indigo-900">Cours disponibles</h2>
                    <button onclick="loadCourses()" class="text-xs text-indigo-600 hover:underline">Actualiser</button>
                </div>
                <div id="courses-list" class="space-y-3">
                    <p class="text-sm text-slate-400 italic">Connectez-vous pour voir les cours et vos inscriptions.</p>
                </div>
            </div>
        </div>
    </main>
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        Plateforme académique libre • Hébergée sur GitHub • Propulsée par Supabase
    </footer>
    <script>
        const SUPABASE_URL = 'https://wertjwcurhfkqepluqxw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Rlvw-moxfvafYqqoGxWoza_YwFEZ...'; // Mettez votre vraie clé ici
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkUser() {
            const { data: { session } } = await _supabase.auth.getSession();
            updateUI(session);
        }

        function updateUI(session) {
            const authContainer = document.getElementById('auth-container');
            const logoutContainer = document.getElementById('logout-container');
            const userStatus = document.getElementById('user-status');
            const userEmailDisplay = document.getElementById('user-email-display');
            if (session) {
                authContainer.classList.add('hidden');
                logoutContainer.classList.remove('hidden');
                userStatus.textContent = 'Connecté';
                userEmailDisplay.textContent = `Connecté en tant que : ${session.user.email}`;
                loadCourses();
            } else {
                authContainer.classList.remove('hidden');
                logoutContainer.classList.add('hidden');
                userStatus.textContent = 'Non connecté';
            }
        }

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) alert('Erreur : ' + error.message);
            else checkUser();
        }

        async function handleSignup() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await _supabase.auth.signUp({ email, password });
            if (error) alert('Erreur : ' + error.message);
            else alert('Inscription réussie ! Connectez-vous.');
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            checkUser();
        }

        async function loadCourses() {
            const coursesList = document.getElementById('courses-list');
            coursesList.innerHTML = '<p class="text-sm text-slate-400">Chargement...</p>';
            const { data, error } = await _supabase.from('courses').select('*');
            if (error) {
                coursesList.innerHTML = `<p class="text-sm text-red-500">Erreur : ${error.message}</p>`;
                return;
            }
            if (!data || data.length === 0) {
                coursesList.innerHTML = '<p class="text-sm text-slate-500">Aucun cours disponible.</p>';
                return;
            }
            coursesList.innerHTML = data.map(c => `
                <div class="p-4 border border-slate-100 bg-slate-50 rounded-lg">
                    <span class="text-xs font-bold text-indigo-600 uppercase">${c.code}</span>
                    <h3 class="font-semibold text-slate-800">${c.title}</h3>
                    <p class="text-sm text-slate-600 mt-1">${c.description || ''}</p>
                </div>
            `).join('');
        }

        checkUser();
    </script>
</body>
</html>
